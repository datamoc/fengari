name: Node.js CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x, 25.x, 26.x]

    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'yarn'
    - name: Install dependencies
      run: yarn --frozen-lockfile
    - run: yarn lint
    - run: yarn test --maxWorkers=$(nproc)
      env:
        PYROEISCONF: '{"LUAI_MAXSTACK":100000}'
    - run: yarn test:extended
      env:
        PYROEISCONF: '{"LUAI_MAXSTACK":100000}'

  browsers:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 24.x
        cache: 'yarn'
    - name: Install dependencies
      run: yarn --frozen-lockfile
    - name: Install Chromium and Firefox
      run: npx playwright-core install --with-deps chromium firefox
    - name: Run the browser bundle in Chromium and Firefox
      run: yarn test:browsers
      env:
        CI: 'true'
